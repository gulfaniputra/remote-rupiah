name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Deno Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Backend Validation
        run: |
          # Circuit breaker: Ensure we aren't in a 'fake' production environment
          if [ -n "$DENO_DEPLOYMENT_ID" ]; then
            echo "Error: DENO_DEPLOYMENT_ID is unexpectedly set in CI environment!"
            exit 1
          fi
          deno task validate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  frontend-tests:
    name: Elm Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Elm & elm-test
        run: npm install -g elm elm-test

      - name: Cache Elm dependencies
        uses: actions/cache@v3
        with:
          path: frontend/elm-stuff
          key: ${{ runner.os }}-elm-${{ hashFiles('frontend/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Run Property-Based & Boundary Tests
        run: cd frontend && elm-test

      - name: Verify Elm Compiles with Optimization
        run: cd frontend && elm make src/Main.elm --optimize --output=/dev/null
