<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Rupiah</title>
    <meta
      name="description"
      content="Personal finance and tax dashboard for Indonesian remote developers — NPPN, PPh 24, and FX tracking."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="elm-app"></div>

    <input
      type="file"
      id="rr-csv-input"
      accept=".csv,text/csv"
      style="display: none"
    />

    <script src="elm.js"></script>
    <script>
      // Environment Configuration Matrix
      var apiUrl =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? "http://localhost:8000"
          : "https://api.remoterupiah.id"; // Fallback production URL placeholder

      var storedToken = localStorage.getItem("rr_token");

      function bootstrapApp(token) {
        var app = Elm.Main.init({
          node: document.getElementById("elm-app"),
          flags: {
            token: token,
            apiUrl: apiUrl,
          },
        });

        // Clear Session Hook
        if (app.ports && app.ports.clearCredentials) {
          app.ports.clearCredentials.subscribe(function () {
            localStorage.removeItem("rr_token");
            window.location.reload();
          });
        }

        // Bind directly to the static DOM element
        var fileInput = document.getElementById("rr-csv-input");

        // Listen for UI request to open system file dialog
        if (app.ports && app.ports.requestCsvFile) {
          app.ports.requestCsvFile.subscribe(function () {
            if (fileInput) {
              fileInput.value = "";
              fileInput.click();
            }
          });
        }

        // Read selected CSV file safely with unified error handling thresholds
        if (fileInput) {
          fileInput.addEventListener("change", function () {
            var file = fileInput.files && fileInput.files[0];
            if (!file || !app.ports || !app.ports.csvSelected) return;

            file
              .text()
              .then(function (csv) {
                app.ports.csvSelected.send(csv);
              })
              .catch(function (err) {
                console.error("Local file extraction failure:", err);
                // If your upload completed port can accept error strings, reset Elm's state safely
                if (app.ports.uploadCompleted) {
                  app.ports.uploadCompleted.send(
                    "Local file processing failed: " + err.message,
                  );
                }
              });
          });
        }

        // Handle the manual multi-part transaction ingest request via ports
        if (app.ports && app.ports.uploadCsv) {
          app.ports.uploadCsv.subscribe(function (payload) {
            // FIXED: Using dynamically evaluated API URL context bounds instead of hardcoded strings
            fetch(apiUrl + "/api/v1/ingest", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + payload.token,
                "Content-Type": "text/csv",
              },
              body: payload.csv,
            })
              .then(function (response) {
                return response.text().then(function (text) {
                  if (app.ports && app.ports.uploadCompleted) {
                    app.ports.uploadCompleted.send(
                      response.ok
                        ? "Upload complete"
                        : "Upload failed: " + response.status + " " + text,
                    );
                  }
                });
              })
              .catch(function (err) {
                if (app.ports && app.ports.uploadCompleted) {
                  app.ports.uploadCompleted.send(
                    "Upload failed: " + err.message,
                  );
                }
              });
          });
        }

        // Local browser compilation to download processed data back down as clean CSV
        if (app.ports && app.ports.downloadCsv) {
          app.ports.downloadCsv.subscribe(function (payload) {
            var blob = new Blob([payload.content], { type: "text/csv" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = payload.filename;
            a.click();
            URL.revokeObjectURL(url);
          });
        }
      }

      // Bootstrap routing phase
      if (storedToken) {
        bootstrapApp(storedToken);
      } else {
        fetch(apiUrl + "/api/auth/token")
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            if (data.token) {
              localStorage.setItem("rr_token", data.token);
              bootstrapApp(data.token);
            } else {
              bootstrapApp("");
            }
          })
          .catch(function () {
            bootstrapApp("");
          });
      }
    </script>
  </body>
</html>
